<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | SBJS Rampuria Jain College</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated floating particles background */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.15);
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(720deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px 20px;
            max-width: 700px;
        }

        /* Glitchy 404 number */
        .error-code {
            font-size: clamp(8rem, 20vw, 14rem);
            font-weight: 900;
            line-height: 1;
            margin-bottom: 10px;
            position: relative;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 30%, #ec4899 60%, #2563eb 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite;
            user-select: none;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .error-code::before,
        .error-code::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #2563eb, #7c3aed, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .error-code::before {
            animation: glitch1 2.5s infinite;
        }

        .error-code::after {
            animation: glitch2 2.5s infinite;
        }

        @keyframes glitch1 {
            0%, 90%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
            92% { clip-path: inset(30% 0 40% 0); transform: translate(-4px, 2px); }
            94% { clip-path: inset(60% 0 10% 0); transform: translate(4px, -2px); }
            96% { clip-path: inset(10% 0 70% 0); transform: translate(-2px, 4px); }
        }

        @keyframes glitch2 {
            0%, 90%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
            91% { clip-path: inset(50% 0 20% 0); transform: translate(3px, -3px); }
            93% { clip-path: inset(20% 0 50% 0); transform: translate(-3px, 3px); }
            95% { clip-path: inset(70% 0 5% 0); transform: translate(2px, -1px); }
        }

        /* Emoji animation */
        .lost-emoji {
            font-size: 4rem;
            display: inline-block;
            animation: bounce 2s ease infinite;
            margin-bottom: 20px;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) rotate(0deg); }
            10% { transform: translateY(-20px) rotate(-5deg); }
            30% { transform: translateY(-10px) rotate(5deg); }
            40% { transform: translateY(-25px) rotate(-3deg); }
            60% { transform: translateY(-5px) rotate(3deg); }
        }

        .subtitle {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 15px;
        }

        .description {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 40px;
            line-height: 1.7;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Button group */
        .btn-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 50px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            border: none;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Search bar */
        .search-box {
            display: flex;
            max-width: 420px;
            margin: 0 auto 40px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: border-color 0.3s;
        }

        .search-box:focus-within {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .search-box input {
            flex: 1;
            padding: 14px 20px;
            background: transparent;
            border: none;
            color: #e2e8f0;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
        }

        .search-box input::placeholder {
            color: #64748b;
        }

        .search-box button {
            padding: 14px 20px;
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .search-box button:hover {
            color: #2563eb;
        }

        /* Quick links */
        .quick-links {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .quick-link {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .quick-link:hover {
            background: rgba(37, 99, 235, 0.15);
            border-color: rgba(37, 99, 235, 0.3);
            color: #93c5fd;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .error-code {
                font-size: 7rem;
            }
            .subtitle {
                font-size: 1.3rem;
            }
            .btn-group {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <!-- Animated particles -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="lost-emoji"><i class="fa-solid fa-graduation-cap"></i></div>
        
        <div class="error-code">404</div>
        
        <h1 class="subtitle">Oops! This page went on a study break</h1>
        <p class="description">
            Looks like this page has graduated and moved on! 
            Don't worry — there's plenty to explore at SBJS Rampuria Jain College.
        </p>

        <div class="btn-group">
            <a href="/" class="btn btn-primary">
                🏠 Back to Home
            </a>
            <a href="/courses" class="btn btn-secondary">
                <i class="fa-solid fa-book"></i> Explore Courses
            </a>
            <a href="/enquiry" class="btn btn-secondary">
                ✍️ Make an Enquiry
            </a>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search for courses, faculty, admissions..." autocomplete="off">
            <button onclick="handleSearch()" aria-label="Search">🔍</button>
        </div>

        <div class="quick-links">
            <a href="/about" class="quick-link">About Us</a>
            <a href="/admissions" class="quick-link">Admissions</a>
            <a href="/faculty" class="quick-link">Faculty</a>
            <a href="/contact" class="quick-link">Contact</a>
        </div>
    </div>

    <script>
        // Generate floating particles
        (function() {
            const container = document.getElementById('particles');
            const count = 30;

            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 6 + 3;
                const left = Math.random() * 100;
                const delay = Math.random() * 15;
                const duration = Math.random() * 10 + 12;
                const hue = Math.random() > 0.5 ? '235' : '270';
                
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = left + '%';
                particle.style.animationDelay = delay + 's';
                particle.style.animationDuration = duration + 's';
                particle.style.background = `rgba(${hue === '235' ? '37, 99, 235' : '124, 58, 237'}, ${Math.random() * 0.2 + 0.05})`;
                
                container.appendChild(particle);
            }
        })();

        // Search handler — redirects to a relevant page based on keyword
        function handleSearch() {
            const input = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!input) return;
            
            const routes = {
                'home': '/',
                'about': '/about',
                'course': '/courses',
                'courses': '/courses',
                'bca': '/courses',
                'bba': '/courses',
                'admission': '/admissions',
                'admissions': '/admissions',
                'faculty': '/faculty',
                'teacher': '/faculty',
                'contact': '/contact',
                'enquiry': '/enquiry',
                'apply': '/enquiry',
                'fee': '/courses',
                'fees': '/courses'
            };

            for (const [keyword, url] of Object.entries(routes)) {
                if (input.includes(keyword)) {
                    window.location.href = url;
                    return;
                }
            }
            
            // Default: go to home
            window.location.href = '/';
        }

        // Enter key for search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleSearch();
        });
    </script>
</body>
</html>
